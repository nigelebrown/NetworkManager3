# INM event bus (role 06). JetStream with file storage; no anonymous access.
# Passwords come from the environment (generated by the installer, mode 0600, never in Git).
server_name: inm-nats
port: 4222
http_port: 8222
max_payload: 1MB

jetstream {
  store_dir: "/data"
  max_memory_store: 256MB
  max_file_store: 20GB
}

authorization {
  users = [
    {
      user: "inm_api"
      password: $INM_NATS_API_PASSWORD
      permissions: {
        publish: ["inm.ui.>", "inm.jobs.>", "$JS.API.>", "$JS.FC.>", "$JS.ACK.>"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: "inm_worker"
      password: $INM_NATS_WORKER_PASSWORD
      permissions: {
        publish: ["inm.events.>", "inm.ui.>", "inm.dlq.>", "$JS.API.>", "$JS.ACK.>", "$JS.FC.>", "_INBOX.>"]
        subscribe: ["inm.jobs.>", "_INBOX.>"]
      }
    }
  ]
}
