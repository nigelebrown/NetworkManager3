# Intelligent Network Manager — Phase 1 single-VM deployment (CentOS Stream 9, Docker Compose).
# Seven logical roles, each independently restartable. Splitting onto seven VMs later changes DNS names in
# this file only (service contracts are unchanged).
#
# Never edit this file on a server. Operate it through deployment/centos9/*.sh, which pass
# --env-file /etc/inm/inm.env (generated secrets, mode 0600) and record every operation.
#
# Networks
#   edge      the only network with a route off the host; only `web` (HTTPS) and `alloy` (syslog) publish ports,
#             and by default they bind 127.0.0.1.
#   frontend  web <-> api                                   (internal: no external route)
#   backend   api, worker, databases, bus, logging          (internal)
#   ai        api <-> ai (and optional ollama)              (internal)
# The network worker is on `backend` only: in Phase 1 it has no route to any device management network.
name: inm

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp"]
  restart: unless-stopped
  logging: *logging

x-app-env: &app-env
  # INM_MODE=live + INM_PROFILE=lab-readonly is the production profile (install.sh --mode live).
  SIMS_MODE: ${INM_MODE:-demo}
  SIMS_INM_PROFILE: ${INM_PROFILE:-demo}
  # Manual configuration changes (SIMS SSID/rename/REST-enable paths) stay off unless the owner sets BOTH
  # INM_DEVICE_WRITE_LOCK=false and INM_ALLOW_CONFIG_CHANGES=true. Automatic optimization is OFF by default
  # (INM_AUTOMATIC_OPTIMIZATION=false) and, when enabled, applies only to devices individually opted in.
  SIMS_DEVICE_WRITE_LOCK: ${INM_DEVICE_WRITE_LOCK:-true}
  SIMS_ALLOW_CONFIG_CHANGES: ${INM_ALLOW_CONFIG_CHANGES:-false}
  SIMS_AUTO_MIGRATE: "false"
  SIMS_FORCE_INITIAL_PASSWORD_CHANGE: "true"
  SIMS_POLL_INTERVAL_SECONDS: ${INM_POLL_INTERVAL_SECONDS:-60}
  # Real hardware TLS verification must be explicitly enabled before production GO.
  # CA bundle path, if set, is INSIDE the api/worker container; provision trust there.
  SIMS_ARUBA_VERIFY_TLS: ${INM_ARUBA_VERIFY_TLS:-true}
  SIMS_ARUBA_CA_BUNDLE: ${INM_ARUBA_CA_BUNDLE:-}
  # Exact-IP TLS exceptions permitted only for explicitly approved private lab APs.
  SIMS_ARUBA_UNTRUSTED_TLS_HOSTS: ${INM_ARUBA_UNTRUSTED_TLS_HOSTS:-}
  SIMS_JWT_SECRET: ${SIMS_JWT_SECRET:?generated by install.sh}
  SIMS_FERNET_KEY: ${SIMS_FERNET_KEY:?generated by install.sh}
  SIMS_DATABASE_URL: postgresql+psycopg://inm_app:${MGMT_DB_PASSWORD:?}@management-db:5432/inm_management
  INM_TELEMETRY_DATABASE_URL: postgresql+psycopg://inm_metrics:${TS_DB_PASSWORD:?}@timeseries-db:5432/inm_telemetry
  INM_NATS_URL: nats://nats:4222
  INM_LOKI_URL: http://loki:3100
  INM_AI_URL: http://ai:8001
  INM_AI_SHARED_TOKEN: ${INM_AI_SHARED_TOKEN:?}
  INM_GIT_COMMIT: ${INM_GIT_COMMIT:-unknown}
  SIMS_OLLAMA_ENABLED: ${INM_OLLAMA_ENABLED:-false}
  SIMS_OLLAMA_URL: http://ai:8001/ollama
  SIMS_OLLAMA_ALLOW_REMOTE: "true"   # "remote" = the isolated ai container on the internal ai network
  SIMS_DATA_DIR: /data
  TZ: UTC

services:
  # ---------------------------------------------------------------- 03 management database
  management-db:
    image: ${INM_IMAGE_POSTGRES:-postgres:17-alpine}
    environment:
      POSTGRES_USER: inm_app
      POSTGRES_PASSWORD: ${MGMT_DB_PASSWORD:?}
      POSTGRES_DB: inm_management
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes: ["management-data:/var/lib/postgresql/data"]
    networks: [backend]
    shm_size: 256m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inm_app -d inm_management"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------- 04 time-series database
  timeseries-db:
    image: ${INM_IMAGE_TIMESCALEDB:-timescale/timescaledb:2.22.1-pg17}
    environment:
      POSTGRES_USER: inm_metrics
      POSTGRES_PASSWORD: ${TS_DB_PASSWORD:?}
      POSTGRES_DB: inm_telemetry
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      TIMESCALEDB_TELEMETRY: "off"
      TS_TUNE_MEMORY: ${INM_TS_MEMORY:-4GB}
    volumes: ["timeseries-data:/var/lib/postgresql/data"]
    networks: [backend]
    shm_size: 256m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inm_metrics -d inm_telemetry"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------- 06 event bus
  nats:
    image: ${INM_IMAGE_NATS:-nats:2.11-alpine}
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      INM_NATS_API_PASSWORD: ${INM_NATS_API_PASSWORD:?}
      INM_NATS_WORKER_PASSWORD: ${INM_NATS_WORKER_PASSWORD:?}
    volumes:
      - ./configs/nats/nats.conf:/etc/nats/nats.conf:ro,Z
      - nats-data:/data
    networks: [backend]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------- 05 logging
  loki:
    image: ${INM_IMAGE_LOKI:-grafana/loki:3.5.5}
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./configs/loki/config.yaml:/etc/loki/config.yaml:ro,Z
      - loki-data:/loki
    networks: [backend]
    restart: unless-stopped
    logging: *logging
    # readiness is probed by the API (System health) and verify.sh; the image ships no shell tools.

  alloy:
    image: ${INM_IMAGE_ALLOY:-grafana/alloy:v1.11.0}
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
    volumes:
      - ./configs/alloy/config.alloy:/etc/alloy/config.alloy:ro,Z
      - alloy-data:/var/lib/alloy/data
    ports:
      - "${INM_SYSLOG_BIND:-127.0.0.1}:${INM_SYSLOG_PORT:-1514}:1514/udp"
      - "${INM_SYSLOG_BIND:-127.0.0.1}:${INM_SYSLOG_PORT:-1514}:1514/tcp"
    networks: [backend, edge]
    depends_on: [loki]
    restart: unless-stopped
    logging: *logging

  # ---------------------------------------------------------------- one-shot schema migration (installer/update)
  migrate:
    image: inm/backend:${INM_VERSION:?}
    build:
      context: .
      dockerfile: deployment/docker/backend.Dockerfile
      args: { INM_GIT_COMMIT: "${INM_GIT_COMMIT:-unknown}" }
    command: ["python", "-m", "backend.cli", "migrate"]
    environment:
      <<: *app-env
      SIMS_ROLE: api
      INM_NATS_USER: inm_api
      INM_NATS_PASSWORD: ${INM_NATS_API_PASSWORD:?}
    networks: [backend]
    depends_on:
      management-db: { condition: service_healthy }
      timeseries-db: { condition: service_healthy }
      nats: { condition: service_healthy }
    restart: "no"
    logging: *logging

  # ---------------------------------------------------------------- 07 AI / analytics (isolated)
  ai:
    <<: *hardening
    image: inm/ai:${INM_VERSION:?}
    build:
      context: .
      dockerfile: deployment/docker/ai.Dockerfile
    # Deliberately NOT the shared app environment: no database, bus, JWT, Fernet or device credentials.
    environment:
      INM_AI_SHARED_TOKEN: ${INM_AI_SHARED_TOKEN:?}
      INM_OLLAMA_URL: ${INM_OLLAMA_INTERNAL_URL:-}
    networks: [ai]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8

  ollama:
    profiles: ["ollama"]
    image: ${INM_IMAGE_OLLAMA:-ollama/ollama:latest}
    volumes: ["ollama-data:/root/.ollama"]
    networks: [ai]
    restart: unless-stopped
    logging: *logging

  # ---------------------------------------------------------------- 01 web/API
  api:
    <<: *hardening
    image: inm/backend:${INM_VERSION:?}
    environment:
      <<: *app-env
      SIMS_ROLE: api
      INM_NATS_USER: inm_api
      INM_NATS_PASSWORD: ${INM_NATS_API_PASSWORD:?}
      SIMS_ADMIN_USERNAME: ${INM_ADMIN_USERNAME:-admin}
      SIMS_ADMIN_PASSWORD: ${SIMS_ADMIN_PASSWORD:?}
      SIMS_DEMO_SIMPLE_LOGIN: ${INM_DEMO_SIMPLE_LOGIN:-false}
      SIMS_FORCE_INITIAL_PASSWORD_CHANGE: ${INM_FORCE_PASSWORD_CHANGE:-true}
      INM_WEB_BIND: ${INM_WEB_BIND:-127.0.0.1}
      INM_LAN_DEMO_ACK: ${INM_LAN_DEMO_ACK:-false}
      INM_LAN_CLIENT_CIDR: ${INM_LAN_CLIENT_CIDR:-}
      INM_READONLY_DEVICE_CIDRS: ${INM_READONLY_DEVICE_CIDRS:-}
      SIMS_CORS_ORIGINS: ""
    volumes: ["app-data:/data"]
    # Egress for opt-in, CIDR-allowlisted, read-only probes. The worker has the same allowlisted
    # egress (network `devices`) for scheduled read-only collection.
    networks: [frontend, backend, ai, edge]
    depends_on:
      migrate: { condition: service_completed_successfully }
      ai: { condition: service_healthy }
      loki: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18

  web:
    <<: *hardening
    image: inm/web:${INM_VERSION:?}
    build:
      context: .
      dockerfile: deployment/docker/web.Dockerfile
    read_only: false            # nginx writes its pid/cache under /var
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
    volumes:
      - ${INM_TLS_DIR:-/etc/inm/tls}:/etc/nginx/tls:ro,Z
      # Loopback default allows all at Nginx because the host binds 127.0.0.1 only.
      # LAN mode binds a generated, private CIDR allowlist under /etc/inm.
      - ${INM_NGINX_ACCESS_FILE:-./configs/nginx/inm-access-default.conf}:/etc/nginx/inm-access.conf:ro,Z
    ports:
      - "${INM_WEB_BIND:-127.0.0.1}:${INM_WEB_PORT:-8443}:8443"
    networks: [frontend, edge]
    depends_on:
      api: { condition: service_healthy }

  # ---------------------------------------------------------------- 02 network worker
  worker:
    <<: *hardening
    image: inm/backend:${INM_VERSION:?}
    command: ["python", "-m", "workers.network_worker.main"]
    environment:
      <<: *app-env
      SIMS_ROLE: worker
      INM_NATS_USER: inm_worker
      INM_NATS_PASSWORD: ${INM_NATS_WORKER_PASSWORD:?}
      # WP-02 scheduled READ-ONLY collection: the same private-CIDR allowlist the API probe enforces.
      # Empty = no device is ever contacted (plans record TARGET_NOT_ALLOWED, never fabricated data).
      INM_READONLY_DEVICE_CIDRS: ${INM_READONLY_DEVICE_CIDRS:-}
      INM_SCHEDULED_COLLECTION: ${INM_SCHEDULED_COLLECTION:-true}
    volumes: ["app-data:/data"]
    # `devices` gives egress for allowlisted read-only polls; the code-level CIDR allowlist and the
    # absence of any write path in the collector are the controls. No published ports.
    networks: [backend, devices]
    depends_on:
      migrate: { condition: service_completed_successfully }
      loki: { condition: service_started }
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-m", "backend.cli", "heartbeat-check", "--max-age", "60"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s

networks:
  edge: {}
  devices: {}
  frontend: { internal: true }
  backend: { internal: true }
  ai: { internal: true }

volumes:
  management-data:
  timeseries-data:
  nats-data:
  loki-data:
  alloy-data:
  app-data:
  ollama-data:
