# Developer CLI: `alembic revision --autogenerate -m "..."` (uses SIMS_DATABASE_URL via .env).
# The application itself applies migrations automatically at startup.
[alembic]
script_location = backend/database/migrations
prepend_sys_path = .

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
