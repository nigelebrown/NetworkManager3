name: Full automated test suite (native, no Docker)

# rc18 section 4: the same one-command runner a developer uses locally. Installs PostgreSQL 16 and builds
# TimescaleDB 2.22.1; stack.sh downloads pinned, checksum-verified NATS / Loki / Alloy release binaries.
# Every device is emulated; the evidence report is uploaded as an artifact. Not hardware certification.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: inm-full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # upgrade tests need the actual previously deployed release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System packages (PostgreSQL 16 server + headers, build tools, Chrome, OpenSSH)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-server-dev-16 cmake gcc git curl unzip iproute2 \
               openssh-client openssh-server libssl-dev
          sudo systemctl stop postgresql || true
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock pytest pytest-asyncio playwright psycopg[binary]
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run every suite and write the evidence report
        run: sudo -E env "PATH=$PATH" bash scripts/run_full_test_suite.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: evidence/test-run-*
