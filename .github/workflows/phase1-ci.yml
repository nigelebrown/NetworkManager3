name: Phase 1 application CI and end-to-end integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inm-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install locked runtime dependencies and test runner
        run: python -m pip install -r requirements.lock pytest pytest-asyncio
      - name: Validate Python syntax
        run: python -m compileall -q backend workers ai_service tests
      - name: Run isolated regression, unit and contract tests
        env:
          SIMS_DISABLE_SCHEDULER: 'true'
        run: python -m pytest -q tests/unit tests/contract
      - name: Run original Wi-Fi Manager regression suite
        env:
          SIMS_DISABLE_SCHEDULER: 'true'
        run: python -m pytest -q backend/tests

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  full-stack-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Run the integration gate independently once the GUI builds: backend
    # failures must not hide full-stack defects behind a SKIPPED result.
    # GitHub still requires BOTH jobs to pass for the workflow to be green.
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Check Git-only deployment entrypoint and shell syntax
        run: |
          for script in deployment/centos9/*.sh scripts/inm.sh scripts/rebuild-demo.sh scripts/allow-readonly-device-range.sh scripts/enable-lan-demo.sh scripts/ensure-lan-schema.sh scripts/inm_full_server_test.sh scripts/inm_hardware_readonly_test.sh scripts/inm_one_click_test.sh scripts/inm_docker_test_bootstrap.sh scripts/inm_recovery_sandbox_test.sh; do
            bash -n "$script"
          done
          bash scripts/inm.sh --help | grep -q 'Git-managed Intelligent Network Manager'
          test -f deployment/releases/approved-demo-tag
          test -f configs/nginx/inm-access-default.conf
          grep -q 'include /etc/nginx/inm-access.conf' configs/nginx/inm.conf
          grep -q 'INM_NGINX_ACCESS_FILE' compose.yaml
          test ! -e scripts/bootstrap_phase1_zip.sh
          test ! -e scripts/import_phase1_source.ps1
      - name: Create ephemeral demo-only secrets and TLS
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          from pathlib import Path
          # NATS parses unquoted env variables as config tokens; lead with a letter.
          # 192 random bits per NATS credential; never expose values in logs.
          env = {
              "INM_VERSION": Path("VERSION").read_text().strip(),
              "INM_PROFILE": "demo",
              "INM_POLL_INTERVAL_SECONDS": "15",
              "INM_WEB_BIND": "127.0.0.1",
              "INM_WEB_PORT": "8443",
              "INM_SYSLOG_BIND": "127.0.0.1",
              "INM_SYSLOG_PORT": "1514",
              "INM_TLS_DIR": str(Path(".ci-tls").resolve()),
              "INM_NATS_API_PASSWORD": "nats" + secrets.token_hex(24),
              "INM_NATS_WORKER_PASSWORD": "nats" + secrets.token_hex(24),
              "MGMT_DB_PASSWORD": secrets.token_urlsafe(36),
              "TS_DB_PASSWORD": secrets.token_urlsafe(36),
              "SIMS_JWT_SECRET": secrets.token_urlsafe(48),
              "SIMS_FERNET_KEY": base64.urlsafe_b64encode(os.urandom(32)).decode(),
              "SIMS_ADMIN_PASSWORD": secrets.token_urlsafe(24),
              "INM_AI_SHARED_TOKEN": secrets.token_urlsafe(48),
          }
          Path(".ci-tls").mkdir(exist_ok=True)
          path = Path(".env.ci")
          path.write_text("".join(f"{k}={v}\n" for k,v in env.items()))
          path.chmod(0o600)
          PY
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj '/CN=localhost' \
            -keyout .ci-tls/tls.key -out .ci-tls/tls.crt >/dev/null 2>&1
          # The hardened Nginx container has CAP_DAC_OVERRIDE removed. Its
          # root process must own the read-only mounted key, not runner UID 1001.
          chmod 600 .ci-tls/tls.key
          sudo chown 0:0 .ci-tls/tls.key .ci-tls/tls.crt
      - name: Validate Compose syntax/topology
        run: docker compose --env-file .env.ci --project-name inm -f compose.yaml config --quiet
      - name: Build images and start all seven logical roles
        run: |
          docker compose --env-file .env.ci --project-name inm -f compose.yaml up \
            --build -d --wait --wait-timeout 600 \
            management-db timeseries-db nats loki alloy ai api web worker
      - name: Verify TLS endpoint and complete synthetic event pipeline
        run: |
          curl --fail --silent --show-error --insecure https://127.0.0.1:8443/healthz
          docker compose --env-file .env.ci --project-name inm -f compose.yaml exec -T api \
            python -m backend.cli verify --api-url http://127.0.0.1:8000 --syslog-host alloy --syslog-port 1514
      - name: Verify PostgreSQL 0004-to-release-head migration preserves existing site data
        run: |
          # Run against a separate disposable database, never the main demo
          # database used by the browser tests.
          docker compose --env-file .env.ci --project-name inm -f compose.yaml \
            exec -T management-db createdb -U inm_app inm_migration_test
          DB_PASS="$(sed -n 's/^MGMT_DB_PASSWORD=//p' .env.ci | head -1)"
          export TEST_MIGRATION_URL="postgresql+psycopg://inm_app:${DB_PASS}@management-db:5432/inm_migration_test"
          docker compose --env-file .env.ci --project-name inm -f compose.yaml \
            run --rm --no-deps -T -e SIMS_DATABASE_URL="$TEST_MIGRATION_URL" migrate \
            python - <<'PY'
          from alembic import command
          from alembic.config import Config
          from backend.database.session import init_engine
          from sqlalchemy import text
          engine = init_engine()
          cfg = Config()
          cfg.set_main_option("script_location", "/app/backend/database/migrations")
          with engine.begin() as conn:
              cfg.attributes["connection"] = conn
              command.upgrade(cfg, "0004")
              conn.execute(text("INSERT INTO sites (name, vc_port, simulated, enabled, created_at) "
                                "VALUES ('Persist-through-release-head', 4343, FALSE, TRUE, '2026-01-01')"))
          print("PASS: created PostgreSQL 0004 with an existing site")
          PY
          docker compose --env-file .env.ci --project-name inm -f compose.yaml \
            run --rm --no-deps -T -e SIMS_DATABASE_URL="$TEST_MIGRATION_URL" migrate
          docker compose --env-file .env.ci --project-name inm -f compose.yaml \
            exec -T management-db psql -U inm_app -d inm_migration_test -Atqc \
            "SELECT version_num FROM alembic_version" | grep -qx "$(python3 -c 'import json;print(json.load(open("release.json"))["management_schema_head"])')"
          docker compose --env-file .env.ci --project-name inm -f compose.yaml \
            exec -T management-db psql -U inm_app -d inm_migration_test -Atqc \
            "SELECT name FROM sites WHERE name = 'Persist-through-release-head'" \
            | grep -qx Persist-through-release-head
          docker compose --env-file .env.ci --project-name inm -f compose.yaml \
            exec -T management-db psql -U inm_app -d inm_migration_test -Atqc \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('onboarding_credentials','onboarding_discoveries','onboarding_config_snapshots','onboarding_config_drafts','onboarding_device_credentials')" \
            | grep -qx 5
          echo "PASS: PostgreSQL 0004-to-release-head migration preserves existing sites and creates onboarding tables"
          unset DB_PASS TEST_MIGRATION_URL
      - name: Run actual browser navigation, WebSocket and dashboard workflows
        env:
          INM_E2E_URL: https://127.0.0.1:8443
          INM_E2E_ALLOW_SELF_SIGNED: '1'
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements.lock pytest pytest-asyncio playwright
          python3 -m playwright install --with-deps chromium
          export INM_E2E_ADMIN_PASSWORD="$(sed -n 's/^SIMS_ADMIN_PASSWORD=//p' .env.ci)"
          python3 -m pytest -q tests/e2e/test_demo_gui.py
      - name: Verify restricted demo login and persistent real inventory
        run: |
          # Reproduce the security-critical post-install configuration performed
          # by scripts/rebuild-demo.sh, without weakening TLS or exposing a port.
          {
            printf '\nINM_DEMO_SIMPLE_LOGIN=true\n'
            printf 'INM_FORCE_PASSWORD_CHANGE=false\n'
            printf 'SIMS_ADMIN_PASSWORD=demo123!\n'
          } >> .env.ci
          docker compose --env-file .env.ci --project-name inm -f compose.yaml \
            up -d --no-deps --force-recreate --wait --wait-timeout 90 api
          docker compose --env-file .env.ci --project-name inm -f compose.yaml \
            exec -T api python -m backend.demo_access
          docker compose --env-file .env.ci --project-name inm -f compose.yaml \
            exec -T api python - <<'PY'
          import httpx
          base = 'http://127.0.0.1:8000'
          with httpx.Client(base_url=base, timeout=15) as client:
              response = client.post('/api/auth/login',
                  json={'username': 'admin', 'password': 'demo123!'})
              assert response.status_code == 200, response.text
              data = response.json()
              assert data['role'] == 'admin'
              assert data['must_change_password'] is False
              headers = {'Authorization': 'Bearer ' + data['access_token']}
              devices = client.get('/api/v1/devices', headers=headers)
              assert devices.status_code == 200, devices.text
              real = [d for d in devices.json() if d['source_type'] == 'REAL']
              assert any(d['hostname'] == 'CI-AP-535' for d in real)
              assert any(d['hostname'] == 'CI-CX6200F' for d in real)
              write = client.post('/api/config/changes/apply',
                  headers=headers, json={})
              assert write.status_code in (403, 404, 422), write.text
          print('PASS: localhost demo login, saved REAL inventory, global device-write lock')
          PY
      - name: Verify opt-in LAN demo API mode on rebuilt backend image
        run: |
          # Reproduce the LAN-specific API configuration without binding a
          # non-existent LAN address on the shared GitHub CI runner.
          # It must become healthy with the SAME demo123! credential.
          {
            printf '\nINM_LAN_DEMO_ACK=true\n'
            printf 'INM_LAN_CLIENT_CIDR=172.17.71.0/24\n'
            printf 'INM_WEB_BIND=172.17.71.21\n'
          } >> .env.ci
          docker compose --env-file .env.ci --project-name inm -f compose.yaml build migrate web
          docker compose --env-file .env.ci --project-name inm -f compose.yaml \
            up -d --no-deps --force-recreate --wait --wait-timeout 120 api
          docker compose --env-file .env.ci --project-name inm -f compose.yaml exec -T api \
            python - <<'PY'
          import os, urllib.request
          assert os.environ.get('INM_WEB_BIND') == '172.17.71.21'
          assert os.environ.get('INM_LAN_DEMO_ACK') == 'true'
          assert os.environ.get('SIMS_ADMIN_PASSWORD') == 'demo123!'
          assert urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=6).status == 200
          print('PASS: rebuilt API accepts restricted LAN demo without changing password')
          PY
      - name: Store demo browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-browser-screenshots
          path: evidence/e2e/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Save service states and logs after failure
        if: failure()
        run: |
          docker compose --env-file .env.ci --project-name inm -f compose.yaml ps || true
          docker compose --env-file .env.ci --project-name inm -f compose.yaml logs --no-color --tail 80 \
            api worker management-db timeseries-db nats ai loki alloy web || true
      - name: Remove disposable demo containers and volumes
        if: always()
        run: docker compose --env-file .env.ci --project-name inm -f compose.yaml down -v --remove-orphans || true
